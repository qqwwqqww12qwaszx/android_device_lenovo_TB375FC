name: Build LineageOS Super Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Maximize Build Disk Space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 16384
        swap-size-mb: 4096
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker: 'true'
        remove-swift: 'true'
        remove-perfetto: 'true'
    
    - name: Free Additional Disk Space
      run: |
        echo "=== Freeing up disk space ==="
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/graalvm
        sudo rm -rf /usr/local/nvm
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /perfetto
        sudo apt-get clean
        docker system prune -a --volumes -f || true
        df -h

    - name: Install Repo Tool
      run: |
        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+rx ~/.bin/repo
        echo 'export PATH="${HOME}/bin:${PATH}"' >> ~/.bashrc

    - name: Initialize and Sync LineageOS Source (Shallow Clone)
      run: |
        export PATH="${HOME}/bin:${PATH}"
        mkdir -p ~/lineage && cd ~/lineage
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # 核心修改：在 repo init 时加入 --depth=1 进行浅克隆，将下载体积缩减 70% 以上
        ~/.bin/repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --git-lfs --depth=1
        
        # 使用循环重试机制，并将并发数降低为 4，防止网络瞬断引起中断
        until ~/.bin/repo sync -c -j4 --no-clone-bundle --no-tags; do
          echo "Sync failed, restarting sync..."
          sleep 3
        done

    - name: Inject Device Tree and Vendor Blobs
      run: |
        cd ~/lineage
        mkdir -p device/lenovo/TB375FC
        mkdir -p vendor/lenovo/TB375FC
        
        git clone https://github.com/qqwwqqww12qwaszx/android_device_lenovo_TB375FC.git -b main device/lenovo/TB375FC
        git clone https://github.com/qqwwqqww12qwaszx/android_vendor_lenovo_TB375FC.git -b main vendor/lenovo/TB375FC

    - name: Start Building Super Image
      run: |
        cd ~/lineage
        source build/envsetup.sh
        lunch lineage_TB375FC-userdebug
        mka superimage

    - name: Upload Super Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: super-image-TB375FC
        path: ~/lineage/out/target/product/TB375FC/super.img
