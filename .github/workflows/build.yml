name: Build LineageOS Super Image

on:
  workflow_dispatch: # 支持 in 网页上手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Maximize Build Disk Space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 16384
        swap-size-mb: 4096
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker: 'true'
        remove-swift: 'true'
        remove-perfetto: 'true'
    
    - name: Free Additional Disk Space
      run: |
        echo "=== Freeing up disk space ==="
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/graalvm
        sudo rm -rf /usr/local/nvm
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /perfetto
        sudo apt-get clean
        docker system prune -a --volumes -f || true
        df -h

    - name: Install Build Dependencies
      run: |
        sudo apt update && sudo apt install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev

    - name: Install Repo Tool
      run: |
        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+rx ~/.bin/repo
        echo 'export PATH="${HOME}/bin:${PATH}"' >> ~/.bashrc

    - name: Initialize and Sync LineageOS Source
      run: |
        export PATH="${HOME}/bin:${PATH}"
        mkdir -p ~/lineage && cd ~/lineage
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        ~/.bin/repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --git-lfs
        # 移除了不支持的 --depth 参数，采用兼容的参数组合
        ~/.bin/repo sync -c -j16 --no-clone-bundle --no-tags

    - name: Inject Device Tree and Vendor Blobs
      run: |
        cd ~/lineage
        mkdir -p device/lenovo/TB375FC
        mkdir -p vendor/lenovo/TB375FC
        
        git clone https://github.com/qqwwqqww12qwaszx/android_device_lenovo_TB375FC.git -b main device/lenovo/TB375FC
        git clone https://github.com/qqwwqqww12qwaszx/android_vendor_lenovo_TB375FC.git -b main vendor/lenovo/TB375FC

    - name: Start Building Super Image
      run: |
        cd ~/lineage
        source build/envsetup.sh
        lunch lineage_TB375FC-userdebug
        mka superimage

    - name: Upload Super Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: super-image-TB375FC
        path: ~/lineage/out/target/product/TB375FC/super.img
